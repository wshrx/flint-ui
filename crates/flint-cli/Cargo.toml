[package]
name = "flint-ui"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Add flint components to a GPUIX app."
repository = "https://github.com/wshrx/flint-ui"

[[bin]]
name = "flint-ui"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
