name: test-windows

# Kept out of test.yml: Buildkite hosted agents have no Windows image, and
# Entire runs test.yml through Buildkite. Run this manually on GitHub, or add
# `push` back once a Windows queue is mapped for the Buildkite pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run registry:check
      - run: bun run contrast
      - run: bun run typecheck
      - run: bun test
