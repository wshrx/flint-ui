name: release

# Tag `v0.1.2` and the workflow builds the Rust CLI, packs both tarballs,
# attaches them to the GitHub release, and uses the hand-written CHANGELOG
# section as the release body. No npm account involved.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild the assets for
        required: true

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - name: Checks
        run: |
          bun run typecheck
          bun run registry:check
          bun run contrast
          bun test
          cargo test --release --manifest-path crates/flint-cli/Cargo.toml

      - name: Release gates
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bun scripts/check-version.ts "${TAG#v}"
          bun scripts/check-docs.ts "${TAG#v}"
          bun scripts/changelog-section.ts "$TAG" > /dev/null

  cli:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            ext: ""
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-arm64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross linker for Linux arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Build the CLI
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          cargo build --release --manifest-path crates/flint-cli/Cargo.toml --target "${{ matrix.target }}"
          mkdir -p dist
          cp "crates/flint-cli/target/${{ matrix.target }}/release/flint-ui${{ matrix.ext }}" "dist/flint-ui-${{ matrix.asset }}${{ matrix.ext }}"

      # Only the runner's own architecture can execute here. The cross-built
      # Linux arm64 and macOS x64 binaries are checked after the release with
      # `bun tools/anvil.ts platforms`.
      - name: Smoke the native binary
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: "dist/flint-ui-${{ matrix.asset }}${{ matrix.ext }} --version"

      - uses: actions/upload-artifact@v4
        with:
          name: flint-ui-${{ matrix.asset }}
          path: dist/flint-ui-${{ matrix.asset }}${{ matrix.ext }}
          if-no-files-found: error

  assets:
    needs: [checks, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Build the package tarball
        env:
          FLINT_NO_RUST: "1"
        run: bun scripts/build-release.ts

      - uses: actions/download-artifact@v4
        with:
          pattern: flint-ui-*
          path: dist/release
          merge-multiple: true

      - run: bun scripts/release-sums.ts

      - name: Release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/changelog-section.ts "$TAG" > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/release/* --clobber
          else
            gh release create "$TAG" dist/release/* \
              --title "flint ${TAG#v}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
